name: Build Web & APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply web compatibility patches
        run: |
          curl -sL -o /tmp/web_patch.tar.gz "https://raw.githubusercontent.com/free-zuike/streak/main/web_patch.tar.gz"
          tar -xzf /tmp/web_patch.tar.gz
          cp -r web_patch/lib/* lib/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Add web platform
        run: flutter create --platforms=web .

      - name: Pub get
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          if-no-files-found: error

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
